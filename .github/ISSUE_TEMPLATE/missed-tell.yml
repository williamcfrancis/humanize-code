name: Missed tell
description: AI-written code that still reads as AI-written after a cleanup, or a tell no pattern covers.
labels: ["enhancement"]
body:
  - type: textarea
    id: example
    attributes:
      label: Example
      description: Real code that shows the tell. Remove anything private.
      render: text
    validations:
      required: true
  - type: textarea
    id: human
    attributes:
      label: How a person would write it
      description: The same code, written the way an experienced developer on your team would. It must do exactly the same thing.
      render: text
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why no current pattern covers it
      description: Name the closest pattern number and say why it misses this. Most new tells fit into an existing pattern.
    validations:
      required: true
