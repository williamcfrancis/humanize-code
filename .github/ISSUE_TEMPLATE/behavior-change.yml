name: Behavior or UI changed
description: A cleanup changed what the code does, what the page renders, or what a test sees.
labels: ["bug", "behavior"]
body:
  - type: markdown
    attributes:
      value: This is the most serious kind of bug for this skill. A minimal example helps the most.
  - type: textarea
    id: before
    attributes:
      label: Code before
      description: The smallest snippet that shows the problem. Remove anything private.
      render: text
    validations:
      required: true
  - type: textarea
    id: after
    attributes:
      label: Code after
      render: text
    validations:
      required: true
  - type: textarea
    id: difference
    attributes:
      label: What changed
      description: The output, rendering, error, or test result that differs, and how you noticed.
    validations:
      required: true
  - type: textarea
    id: call
    attributes:
      label: How you called it
      description: The agent and model, and your exact prompt.
      placeholder: "Claude Code, Opus 5.5: /humanize-code src/components"
    validations:
      required: true
